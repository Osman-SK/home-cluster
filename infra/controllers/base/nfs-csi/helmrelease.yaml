apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: nfs-csi
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.11.0"          # stable version
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
  values:
    controller:
      replicas: 1
      runOnControlPlane: true
    driver:
      mountPermissions: "0755"
    storageClass:
      create: false               #  manage myself 
