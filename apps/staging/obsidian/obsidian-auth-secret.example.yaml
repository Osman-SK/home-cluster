#
#   kubectl -n obsidian create secret generic obsidian-auth \
#     --from-literal=password='YourStrongPassword' \
#     --dry-run=client -o yaml > obsidian-auth-secret.yaml
#   sops -e -i obsidian-auth-secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: obsidian-auth
  namespace: obsidian
type: Opaque
stringData:
  password: "CHANGE_ME"
