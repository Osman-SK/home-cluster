apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: livesync
  labels:
    app: couchdb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb

    spec:
      nodeSelector:
        kubernetes.io/hostname: hp-8200
      securityContext:
        fsGroup: 5984
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-data-perms
          image: busybox:1.38
          command:
            - sh
            - -c
            - chown -R 5984:5984 /data && chmod 775 /data
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /data       

      containers:
        - name: couchdb
          image: couchdb:3.5.2
          ports:
            - name: http
              containerPort: 5984
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-auth
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-auth
                  key: COUCHDB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: local-ini
              mountPath: /opt/couchdb/etc/local.d/livesync.ini
              subPath: livesync.ini
              readOnly: true
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: couchdb-data
        - name: local-ini
          configMap:
            name: couchdb-local-ini
