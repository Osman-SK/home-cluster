apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audio-book-shelf-config
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-hdd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audio-book-shelf-metadata
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-hdd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audio-book-shelf-audiobooks
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-hdd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audio-book-shelf-podcasts
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-hdd
  resources:
    requests:
      storage: 1Gi
